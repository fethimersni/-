<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5f58">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<title>مفكرة الأستاذ</title>
<style>
:root{--bg:#f2f5f4;--card:#fff;--tx:#12302d;--mu:#5f7b77;--pr:#0f766e;--dk:#0b4f4a;--am:#f5a524;--bd:#dfe8e6;--ok:#047857;--okb:#d1fae5;--bad:#b91c1c;--badb:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0b1716;--card:#122624;--tx:#e6f4f1;--mu:#8fb0ab;--bd:#1f3b38;--okb:#064e3b;--ok:#6ee7b7;--badb:#4c1d1d;--bad:#fca5a5}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Cairo,"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:96px;min-height:100dvh}
header{background:linear-gradient(160deg,var(--pr),var(--dk));color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 54px;border-radius:0 0 34px 34px}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:24px;font-weight:800}
small{display:block;color:var(--mu);font-size:12px}
header small{color:#bfe6e1}
#cls{width:100%;margin-top:14px;background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:14px;padding:11px 12px;font:inherit;font-weight:600}
#cls option{color:#000}
#tri{display:flex;gap:6px;margin-top:12px;overflow:auto}
#tri b{padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.14);font-size:13px;white-space:nowrap;cursor:pointer}
#tri b.on{background:var(--am);color:#2b1a00}
main{max-width:720px;margin:-30px auto 0;padding:0 14px;display:grid;gap:12px}
.card{background:var(--card);border-radius:22px;padding:16px;border:1px solid var(--bd);box-shadow:0 6px 18px rgba(15,95,88,.07)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .card{padding:14px;border-radius:18px}
.g .card:first-child{background:var(--pr);color:#fff;border:0}
.g .card:first-child small{color:#bfe6e1}
.g h2{font-size:28px;font-weight:800;line-height:1.2}
h3{font-size:16px;margin-bottom:8px}
.ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--bg);font-size:18px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;cursor:pointer}
.row p{flex:1;font-weight:600}
.card.row{padding:13px 16px}
.av{width:40px;height:40px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.pill{padding:3px 12px;border-radius:99px;font-size:14px;background:var(--bd);display:inline-block}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.bad{background:var(--badb);color:var(--bad)}
.bar{display:flex;align-items:center;gap:10px;font-size:13px;margin:9px 0}
.bar span{width:54px;color:var(--mu)}.bar i{flex:1;height:9px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar u{display:block;height:100%;border-radius:9px;transition:width .5s}
.in{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.btn{display:block;width:100%;text-align:center;border:0;padding:13px;border-radius:16px;font:inherit;font-weight:700;color:#fff;background:var(--pr);margin-top:10px;cursor:pointer}
.btn.bad{background:#dc2626}.btn.alt{background:var(--bd);color:var(--tx)}
.ghost{background:none;border:0;font-size:18px;cursor:pointer}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);z-index:5}
nav a{flex:1;display:grid;justify-items:center;font-size:12px;font-weight:600;color:var(--mu);padding:6px;border-radius:14px;cursor:pointer}
nav a span{font-size:20px}
nav a.on{color:var(--pr);background:var(--bg)}
@media(prefers-color-scheme:dark){nav a.on{color:#5eead4}}
#fab{position:fixed;bottom:88px;left:18px;width:58px;height:58px;border-radius:20px;border:0;color:#2b1a00;font-size:30px;background:var(--am);box-shadow:0 10px 24px rgba(245,165,36,.45);display:none;place-items:center;z-index:6}
#ov{position:fixed;inset:0;background:rgba(5,20,18,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.on{display:flex}
.bx{background:var(--bg);width:100%;max-width:560px;max-height:88dvh;overflow:auto;border-radius:28px 28px 0 0;padding:20px;animation:up .22s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.gi{width:86px;padding:9px;text-align:center;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.gi.x{border-color:#dc2626}
.mu{color:var(--mu)}
.empty{text-align:center;padding:28px 16px}.empty span{font-size:46px}
</style>
</head>
<body>
<header>
 <div class="top"><div><small>متابعة نتائج التلاميذ</small><h1>مفكرة الأستاذ</h1></div><span style="font-size:36px">📖</span></div>
 <select id="cls" onchange="D.cur=this.value;save();render()"></select>
 <div id="tri"></div>
</header>
<main id="main"></main>
<button id="fab" onclick="tab=='stu'?addS():addT()">＋</button>
<nav>
 <a data-t="home" onclick="go('home')"><span>🏠</span>الرئيسية</a>
 <a data-t="stu" onclick="go('stu')"><span>👥</span>التلاميذ</a>
 <a data-t="tst" onclick="go('tst')"><span>📝</span>الفروض</a>
 <a data-t="set" onclick="go('set')"><span>⚙️</span>الإعدادات</a>
</nav>
<div id="ov" onclick="if(event.target==this)closeSh()"><div id="sh" class="bx"></div></div>
<script>
const $=s=>document.querySelector(s),K='mofakkira.v1',TY=['فرض مراقبة','فرض تأليفي','إنتاج كتابي','قراءة','قواعد لغة','مشاركة شفوية'];
let D;try{D=JSON.parse(localStorage.getItem(K))}catch{}
D=D||{classes:[],students:[],tests:[],grades:{},cur:null};
let tab='home',tri=0,q='',ev;
if(!D.cur&&D.classes[0])D.cur=D.classes[0].id;
const save=()=>localStorage.setItem(K,JSON.stringify(D)),uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
stu=()=>D.students.filter(s=>s.cid==D.cur),
tst=()=>D.tests.filter(t=>t.cid==D.cur&&(!tri||t.tri==tri)),
has=g=>g!=null&&g!=='',
avg=s=>{let a=0,n=0;tst().forEach(t=>{const g=(D.grades[t.id]||{})[s.id];if(has(g)){a+=g/t.max*20;n++}});return n?a/n:null},
f=v=>v==null?'—':(Math.round(v*100)/100).toString(),
cl=v=>v==null?'':v>=10?'ok':'bad',
bg=n=>`background:hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360} 55% 45%)`,
row=x=>`<div class="row" onclick="showS('${x.s.id}')"><span class="av" style="${bg(x.s.name)}">${esc(x.s.name[0])}</span><p>${esc(x.s.name)}</p><b class="pill ${cl(x.a)}">${f(x.a)}</b></div>`;
const go=t=>{tab=t;q='';render();scrollTo(0,0)};
const sheet=h=>{$('#sh').innerHTML=h;$('#ov').classList.add('on')},closeSh=()=>$('#ov').classList.remove('on');

const V={
home(){
 const S=stu(),R=S.map(s=>({s,a:avg(s)})).filter(x=>x.a!=null).sort((a,b)=>b.a-a.a),
 m=R.length?R.reduce((t,x)=>t+x.a,0)/R.length:null,p=R.length?R.filter(x=>x.a>=10).length*100/R.length:null,
 B=[['أقل من 8',0,8,'#ef4444'],['8 – 10',8,10,'#f59e0b'],['10 – 14',10,14,'#0d9488'],['14 فأكثر',14,21,'#047857']].map(([l,a,b,c])=>[l,R.filter(x=>x.a>=a&&x.a<b).length,c]),
 mx=Math.max(1,...B.map(x=>x[1]));
 return `<div class="g">${[['👥','عدد التلاميذ',S.length],['📊','المعدل العام',f(m)],['✅','نسبة النجاح',p==null?'—':Math.round(p)+'%'],['📝','عدد الفروض',tst().length]].map(([i,l,v])=>`<div class="card"><div class="ic">${i}</div><small>${l}</small><h2>${v}</h2></div>`).join('')}</div>
 <div class="card"><h3>توزيع المعدلات</h3>${B.map(([l,n,c])=>`<div class="bar"><span>${l}</span><i><u style="width:${n/mx*100}%;background:${c}"></u></i><b>${n}</b></div>`).join('')}</div>
 <div class="card"><h3>🏆 المتميزون</h3>${R.slice(0,3).map(row).join('')||'<p class="mu">ستظهر النتائج بعد إدخال الأعداد.</p>'}</div>
 <div class="card"><h3>🤝 يحتاجون إلى دعم</h3>${R.filter(x=>x.a<10).slice(-3).reverse().map(row).join('')||'<p class="mu">لا أحد تحت المعدل 👏</p>'}</div>`},
stu(){return `<input class="in" placeholder="🔍 ابحث عن تلميذ" value="${esc(q)}" oninput="q=this.value;$('#L').innerHTML=list()"><div class="card" id="L">${list()}</div>`},
tst(){return tst().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(t=>{const G=D.grades[t.id]||{},v=stu().map(s=>G[s.id]).filter(has),m=v.length?v.reduce((a,b)=>a+b,0)/v.length/t.max*20:null;
 return `<div class="card row" onclick="grid('${t.id}')"><div class="ic">📝</div><p>${esc(t.title)}<small>${t.type} · الثلاثي ${t.tri} · ${t.date}</small></p><div style="text-align:center"><b class="pill ${cl(m)}">${f(m)}</b><small>${v.length}/${stu().length}</small></div></div>`}).join('')||'<div class="card empty"><span>📝</span><p>لا توجد فروض بعد. اضغط ＋ لإضافة أول فرض.</p></div>'},
set(){return `<div class="card"><h3>الأقسام</h3>${D.classes.map(c=>`<div class="row" style="cursor:default"><p>${esc(c.name)}<small>${D.students.filter(s=>s.cid==c.id).length} تلميذ</small></p><button class="ghost" onclick="delC('${c.id}')">🗑</button></div>`).join('')}<button class="btn" onclick="addC()">＋ قسم جديد</button></div>
 <div class="card"><h3>النسخ الاحتياطي</h3><p class="mu">بياناتك محفوظة على هذا الجهاز فقط، فصدّر نسخة من حين لآخر.</p><button class="btn alt" onclick="exp()">⬇️ تصدير نسخة</button><label class="btn alt" style="cursor:pointer">⬆️ استيراد نسخة<input type="file" hidden accept=".json" onchange="imp(this.files[0])"></label></div>
 <div class="card"><h3>تثبيت التطبيق</h3>${ev?'<button class="btn" onclick="ev.prompt()">📲 تثبيت على الشاشة الرئيسية</button>':'<p class="mu">من قائمة المتصفح اختر «تثبيت التطبيق»، وعلى iPhone: مشاركة ← إضافة إلى الشاشة الرئيسية.</p>'}</div>`}};
const list=()=>stu().map(s=>({s,a:avg(s)})).filter(x=>x.s.name.includes(q)).map(row).join('')||'<p class="mu">لا يوجد تلاميذ. اضغط ＋ لإضافتهم.</p>';

function render(){
 $('#cls').innerHTML=D.classes.map(c=>`<option value="${c.id}" ${c.id==D.cur?'selected':''}>${esc(c.name)}</option>`).join('')||'<option>لا يوجد قسم</option>';
 $('#tri').innerHTML=['كل السنة','الثلاثي 1','الثلاثي 2','الثلاثي 3'].map((t,i)=>`<b class="${i==tri?'on':''}" onclick="tri=${i};render()">${t}</b>`).join('');
 document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t==tab));
 $('#fab').style.display=(tab=='stu'||tab=='tst')&&D.cur?'grid':'none';
 $('#main').innerHTML=D.cur||tab=='set'?V[tab]():'<div class="card empty"><span>🎓</span><h3>ابدأ بإنشاء قسمك الأول</h3><p class="mu">مثال: السابعة أساسي 3</p><button class="btn" onclick="addC()">＋ إنشاء قسم</button></div>';
}
function addC(){sheet('<h3>قسم جديد</h3><input id="cn" class="in" placeholder="اسم القسم، مثال: السابعة أساسي 3"><button class="btn" onclick="saveC()">إنشاء القسم</button>')}
function saveC(){const n=$('#cn').value.trim();if(!n)return;const c={id:uid(),name:n};D.classes.push(c);D.cur=c.id;save();closeSh();render()}
function delC(id){if(!confirm('سيُحذف القسم بكل تلاميذه وفروضه. متأكد؟'))return;const T=D.tests.filter(t=>t.cid==id).map(t=>t.id);T.forEach(t=>delete D.grades[t]);D.tests=D.tests.filter(t=>t.cid!=id);D.students=D.students.filter(s=>s.cid!=id);D.classes=D.classes.filter(c=>c.id!=id);D.cur=D.classes[0]?.id||null;save();render()}
function addS(){sheet('<h3>إضافة تلاميذ</h3><textarea id="nm" class="in" rows="8" placeholder="اكتب اسمًا في كل سطر"></textarea><button class="btn" onclick="saveS()">إضافة</button>')}
function saveS(){$('#nm').value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(n=>D.students.push({id:uid(),cid:D.cur,name:n}));save();closeSh();render()}
function showS(id){const s=D.students.find(x=>x.id==id),a=avg(s);
 sheet(`<div class="row" style="cursor:default"><span class="av" style="${bg(s.name)}">${esc(s.name[0])}</span><p>${esc(s.name)}<small>المعدل</small></p><b class="pill ${cl(a)}">${f(a)}</b></div><div class="card">${tst().map(t=>{const g=(D.grades[t.id]||{})[id];return `<div class="row" style="cursor:default"><p>${esc(t.title)}<small>${t.type}</small></p><b>${has(g)?g+' / '+t.max:'—'}</b></div>`}).join('')||'<p class="mu">لا توجد فروض.</p>'}</div><button class="btn alt" onclick="ren('${id}')">✏️ تعديل الاسم</button><button class="btn bad" onclick="delS('${id}')">حذف التلميذ</button>`)}
function ren(id){const s=D.students.find(x=>x.id==id),n=prompt('الاسم الجديد',s.name);if(n&&n.trim()){s.name=n.trim();save();closeSh();render()}}
function delS(id){if(!confirm('حذف هذا التلميذ ونتائجه؟'))return;D.students=D.students.filter(s=>s.id!=id);Object.values(D.grades).forEach(g=>delete g[id]);save();closeSh();render()}
function addT(){sheet(`<h3>فرض جديد</h3><input id="tt" class="in" placeholder="العنوان (اختياري)"><select id="ty" class="in">${TY.map(x=>`<option>${x}</option>`).join('')}</select><select id="tr" class="in">${[1,2,3].map(i=>`<option value="${i}" ${i==(tri||1)?'selected':''}>الثلاثي ${i}</option>`).join('')}</select><input id="dt" class="in" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="mx" class="in" type="number" value="20" placeholder="العدد الأقصى"><button class="btn" onclick="saveT()">إنشاء وإدخال الأعداد</button>`)}
function saveT(){const ty=$('#ty').value,t={id:uid(),cid:D.cur,title:$('#tt').value.trim()||ty,type:ty,tri:+$('#tr').value,date:$('#dt').value,max:+$('#mx').value||20};D.tests.push(t);if(tri&&tri!=t.tri)tri=0;save();closeSh();render();grid(t.id)}
function grid(id){const t=D.tests.find(x=>x.id==id),G=D.grades[id]||{};
 sheet(`<h3>${esc(t.title)} <small style="display:inline">من ${t.max}</small></h3><div class="card">${stu().map(s=>`<label class="row" style="cursor:default"><p>${esc(s.name)}</p><input class="gi" type="number" inputmode="decimal" min="0" max="${t.max}" step="0.25" value="${has(G[s.id])?G[s.id]:''}" oninput="setG('${id}','${s.id}',this)"></label>`).join('')||'<p class="mu">أضف تلاميذ أولًا.</p>'}</div><button class="btn" onclick="closeSh();render()">تم</button><button class="btn bad" onclick="delT('${id}')">حذف الفرض</button>`)}
function setG(t,s,el){const v=el.value===''?'':+el.value,mx=D.tests.find(x=>x.id==t).max;if(v!==''&&(v<0||v>mx)){el.classList.add('x');return}el.classList.remove('x');(D.grades[t]??={})[s]=v;save()}
function delT(id){if(!confirm('حذف هذا الفرض وأعداده؟'))return;D.tests=D.tests.filter(t=>t.id!=id);delete D.grades[id];save();closeSh();render()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='mofakkira-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
function imp(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.classes||!x.students)throw 0;D=x;save();render();alert('تم الاستيراد ✅')}catch{alert('الملف غير صالح')}};r.readAsText(file)}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;if(tab=='set')render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
</body>
</html>
